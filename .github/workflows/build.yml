name: Build and test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize-recover=undefined"
      - name: Build
        run: cmake --build build -j
      - name: Run programs against their tests
        run: ctest --test-dir build --output-on-failure -j
        env:
          # several exercises intentionally never free (e.g. Company lists); only fail on real memory errors
          ASAN_OPTIONS: detect_leaks=0
